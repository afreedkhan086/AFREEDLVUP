<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin • AFREED LV UP</title><style>*{box-sizing:border-box}body{margin:0;background:#070b12;color:#f8fafc;font-family:Inter,system-ui,sans-serif}.wrap{max-width:1100px;margin:auto;padding:20px}.head{display:flex;justify-content:space-between;gap:10px;align-items:center}.card{background:#0b111b;border:1px solid #263244;border-radius:18px;padding:18px;margin:14px 0}h1,h2{margin-top:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:700px){.grid{grid-template-columns:1fr}}input,select,textarea,button{width:100%;padding:12px;border-radius:10px;border:1px solid #263244;background:#070b12;color:#fff}button{font-weight:800;cursor:pointer;background:#2563eb;border:0;margin-top:8px}.green{background:#16a34a}.red{background:#dc2626}.muted{color:#94a3b8;font-size:12px}.request{border:1px solid #263244;border-radius:14px;padding:14px;margin:10px 0}.request img{max-width:220px;max-height:260px;display:block;margin:8px 0;border-radius:10px;background:#fff}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pill{display:inline-block;padding:4px 8px;border-radius:20px;background:#1e293b;font-size:11px}.approved{color:#86efac}.pending{color:#fde68a}.rejected{color:#fca5a5}</style></head><body><div class="wrap"><div class="head"><div><h1>🇮🇳 AFREED Admin</h1><div class="muted">Customers • UPI • pricing • payment verification</div></div><button style="max-width:110px" onclick="logout()">Logout</button></div><div class="card"><h2>UPI & Pricing Control</h2><div class="grid"><div><label>UPI ID</label><input id="upi"></div><div><label>Payee name</label><input id="payee"></div></div><div id="plans"></div><div class="row"><input id="qr" type="file" accept="image/*"><button onclick="uploadQR()">Upload QR</button></div><button class="green" onclick="saveStore()">Save Payment Settings</button><p id="msg" class="muted"></p></div><div class="card"><h2>Pending Customer Payments</h2><div id="requests">Loading…</div></div><div class="card"><h2>Customers</h2><div id="users">Loading…</div></div></div><script>
let store={};async function loadStore(){let r=await fetch('/api/admin/store');let j=await r.json();if(j.status!=='ok')return;store=j.store;upi.value=store.upi_id||'';payee.value=store.payee_name||'';renderPlans()}function renderPlans(){plans.innerHTML=(store.plans||[]).map((p,i)=>`<div class="row" style="margin:10px 0"><input data-k="name" data-i="${i}" value="${esc(p.name)}"><input data-k="price" data-i="${i}" type="number" value="${p.price}"><input data-k="account_limit" data-i="${i}" type="number" value="${p.account_limit}"><input data-k="duration_value" data-i="${i}" type="number" value="${p.duration_value}"><select data-k="duration_unit" data-i="${i}"><option ${p.duration_unit==='days'?'selected':''}>days</option><option ${p.duration_unit==='hours'?'selected':''}>hours</option><option ${p.duration_unit==='minutes'?'selected':''}>minutes</option></select></div>`).join('')}async function saveStore(){document.querySelectorAll('[data-k]').forEach(e=>{store.plans[+e.dataset.i][e.dataset.k]=e.value});store.plans.forEach(p=>{p.price=+p.price;p.account_limit=+p.account_limit;p.duration_value=+p.duration_value});let r=await fetch('/api/admin/store',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({upi_id:upi.value,payee_name:payee.value,plans:store.plans})});let j=await r.json();msg.textContent=j.status==='ok'?'Saved':'Error: '+(j.error||'');}async function uploadQR(){let f=qr.files[0];if(!f)return;let fd=new FormData();fd.append('qr',f);let r=await fetch('/api/admin/store/qr',{method:'POST',body:fd});let j=await r.json();msg.textContent=j.status==='ok'?'QR updated':'Error: '+(j.error||'')}async function loadRequests(){let r=await fetch('/api/admin/payment-requests');let j=await r.json();requests.innerHTML=(j.requests||[]).map(x=>`<div class="request"><div><b>${esc(x.username)}</b> • ₹${x.price} • ${esc(x.plan_name)} <span class="pill ${x.status}">${x.status}</span></div><div class="muted">Request: ${x.id} • UTR: ${esc(x.utr)}</div><div class="muted">Password: ${esc(x.password)}</div>${x.screenshot?`<img src="${x.screenshot}">`:''}${x.status==='pending'?`<div class="row"><button class="green" onclick="decide('${x.id}','approve')">Verify & Activate</button><button class="red" onclick="decide('${x.id}','reject')">Reject</button></div>`:''}</div>`).join('')||'<p class="muted">No payment requests.</p>'}async function decide(id,d){let note=prompt('Admin note (optional):')||'';let r=await fetch('/api/admin/payment-decision',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({request_id:id,decision:d,note})});let j=await r.json();alert(j.status==='ok'?'Done':j.error||'Failed');loadRequests();loadUsers()}async function loadUsers(){let r=await fetch('/api/admin/users');let j=await r.json();users.innerHTML=(j.users||[]).map(x=>`<div class="request"><b>${esc(x.username)}</b> • ${x.accounts_count}/${x.account_limit} accounts • ${x.is_active?'Active':'Expired'}<div class="muted">Expires: ${new Date(x.expires_at*1000).toLocaleString('en-IN')}</div></div>`).join('')||'<p class="muted">No customers.</p>'}function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}async function logout(){await fetch('/api/logout',{method:'POST'});location='/admin-login'}loadStore();loadRequests();loadUsers();setInterval(loadRequests,15000);</script></body></html>
