<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AFREED LV UP</title>
<style>
:root{--bg:#05070b;--panel:rgba(12,16,24,.88);--border:rgba(255,255,255,.08);--accent:#00e5ff;--accent2:#7c3aed;--text:#f5f7fb;--muted:#8f9aaa}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 10%,rgba(0,229,255,.08),transparent 32%),radial-gradient(circle at 85% 85%,rgba(124,58,237,.09),transparent 34%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px}.wrap{width:min(720px,100%)}.card{background:var(--panel);border:1px solid var(--border);border-radius:22px;padding:34px 26px;text-align:center;box-shadow:0 18px 60px rgba(0,0,0,.35);backdrop-filter:blur(14px)}.brand{font-size:27px;font-weight:900;letter-spacing:.5px}.brand span{color:var(--accent);text-shadow:0 0 18px rgba(0,229,255,.28)}.sub{margin:9px 0 26px;color:var(--muted);font-size:13px}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.btn{display:inline-flex;align-items:center;justify-content:center;min-width:135px;padding:13px 20px;border-radius:11px;text-decoration:none;font-weight:800;font-size:13px;color:#fff;border:1px solid rgba(0,229,255,.35);background:linear-gradient(135deg,rgba(0,229,255,.18),rgba(124,58,237,.16));transition:.2s}.btn:hover{transform:translateY(-1px);border-color:var(--accent);box-shadow:0 0 22px rgba(0,229,255,.12)}.hint{margin-top:20px;color:#697487;font-size:11px}.footer{margin-top:16px;color:#596477;font-size:10px}
</style>
</head>
<body>
<div class="wrap"><div class="card">
  <div class="brand">🇮🇳 <span>AFREED</span> LV UP</div>
  <div class="sub">Level Up Service • Indian UPI Payment</div>
  <div class="actions">
    <a class="btn" href="/buy">BUY PLAN</a>
  </div>
  <div class="hint">Tap BUY PLAN to view plans, UPI ID and QR payment.</div>
  <div class="footer">Secure payment requests are manually verified.</div>
</div></div>
</body>
</html>
