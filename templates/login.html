<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customer Login</title><style>body{margin:0;background:#070b12;color:#fff;font-family:system-ui;padding:50px 20px}.box{max-width:420px;margin:auto;background:#0b111b;border:1px solid #263244;border-radius:20px;padding:25px}input,button{width:100%;box-sizing:border-box;padding:13px;margin:7px 0;border-radius:11px;border:1px solid #263244;background:#070b12;color:#fff}button{background:#16a34a;border:0;font-weight:800}</style></head><body><div class="box"><h2>Customer Login</h2><input id="u" placeholder="Username"><input id="p" type="password" placeholder="Password"><button onclick="go()">Login</button><p id="m"></p><a href="/buy">Need a plan? Buy with UPI</a></div><script>async function go(){let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u.value,password:p.value})});let j=await r.json();if(j.status==='ok')location='/dashboard';else m.textContent=j.error||'Login failed'}</script></body></html>
